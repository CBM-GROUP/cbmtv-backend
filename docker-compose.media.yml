# Optional LOCAL worker overlay. This does not change the release deployment.
# Validate configuration, apply reviewed migrations, then explicitly enable:
# docker compose -f docker-compose.yml -f docker-compose.media.yml --profile media-worker up -d --build media-worker
services:
  media-worker:
    profiles: [media-worker]
    build:
      context: .
      dockerfile: Dockerfile
    image: cbmtv-api:local
    init: true
    restart: unless-stopped
    # Bypass the web entrypoint: the worker must not collect static files or
    # independently apply migrations. Run migrations once before starting it.
    entrypoint: [python, manage.py, process_media]
    command: [--poll-seconds, "5"]
    env_file:
      - path: .env
        required: false
    environment:
      # Match the LOCAL base compose API/PostgreSQL configuration. DATABASE_URL,
      # when supplied in .env, retains Django's existing higher precedence.
      DB_NAME: ${POSTGRES_DB:-cbmtv}
      DB_USER: ${POSTGRES_USER:-cbmtv}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cbmtv_local_password}
      DB_HOST: postgres
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY before starting the worker}
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
    # The image's web HTTP probe is inapplicable to a queue worker.
    healthcheck:
      disable: true
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Disk-backed scratch, never a multi-GB video in a memory-backed tmpfs.
    # A named volume has NO size quota; provision/monitor its backing disk and
    # align MEDIA_MAX_MULTIPART_BYTES in BOTH API and worker before using it.
    volumes:
      - media_scratch:/tmp

volumes:
  media_scratch:
