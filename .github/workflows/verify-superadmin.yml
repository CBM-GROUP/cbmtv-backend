name: Verify EC2 superadmin

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check superadmin without printing credentials
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          script: |
            set -eu
            cd /opt/cbmtv-backend
            docker compose -f docker-compose.prod.yml exec -T api python manage.py shell -c 'import os, sys; from django.contrib.auth import get_user_model; email="admin@cbmtv.online"; user=get_user_model().objects.filter(email=email).first(); configured_email=os.environ.get("DJANGO_SUPERUSER_EMAIL"); secret=os.environ.get("DJANGO_SUPERUSER_PASSWORD"); email_ok=configured_email==email; flags_ok=bool(user and user.is_superuser and user.is_staff and user.is_active and user.role=="admin"); password_ok=bool(user and secret and user.check_password(secret)); print("account_present="+str(bool(user))); print("email_configured="+str(bool(configured_email))); print("password_configured="+str(bool(secret))); print("email_matches_config="+str(email_ok)); print("flags_ok="+str(flags_ok)); print("password_matches_config="+str(password_ok)); sys.exit(0 if email_ok and flags_ok and password_ok else 1)'
