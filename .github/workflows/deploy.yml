name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: Search index maintenance on the audit branch
        type: choice
        options: [audit, reindex]
        default: audit

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  audit-search-index:
    name: Audit production search index without changes
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/search-index-audit' && inputs.operation != 'reindex'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare approved database titles with active Meilisearch documents
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          envs: EC2_APP_DIR
          command_timeout: 3m
          script: |
            set -eu
            cd "$EC2_APP_DIR"
            docker compose -f docker-compose.prod.yml exec -T api python - <<'PY'
            import json
            import os
            from urllib.parse import quote, urlparse

            import django
            import requests

            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'cbmtv.settings')
            django.setup()
            from django.conf import settings
            from content.models import Content

            uid = settings.MEILISEARCH_INDEX
            base = settings.MEILISEARCH_URL.rstrip('/')
            if not base:
                raise SystemExit('Meilisearch URL is not configured.')
            headers = {'Authorization': f'Bearer {settings.MEILISEARCH_MASTER_KEY}'}
            index_url = f'{base}/indexes/{quote(uid, safe="")}'
            def get(path, **params):
                response = requests.get(index_url + path, headers=headers, params=params, timeout=10)
                response.raise_for_status()
                return response.json()

            approved = set(Content.objects.filter(status='approved').values_list('id', flat=True))
            try:
                stats = get('/stats')
            except requests.HTTPError as exc:
                local_status = requests.get(
                    f'http://meilisearch:7700/indexes/{quote(uid, safe="")}/stats',
                    headers=headers, timeout=10,
                ).status_code
                print(json.dumps({
                    'index': uid,
                    'configured_target_is_local': urlparse(base).hostname in ('meilisearch', 'localhost', '127.0.0.1'),
                    'approved_database_count': len(approved),
                    'configured_key_present': bool(settings.MEILISEARCH_MASTER_KEY),
                    'stats_http_status': exc.response.status_code,
                    'local_stats_http_status': local_status,
                }, sort_keys=True))
                raise SystemExit(0)
            config = get('/settings')
            documents = []
            offset = 0
            while True:
                page = get('/documents', offset=offset, limit=1000)
                rows = page.get('results', [])
                documents.extend(rows)
                offset += len(rows)
                if len(rows) < 1000:
                    break
                if offset > 100000:
                    raise SystemExit('Index audit exceeded the safe document limit.')
            indexed = {int(row['id']) for row in documents if str(row.get('id', '')).isdigit()}
            print(json.dumps({
                'index': uid,
                'approved_database_count': len(approved),
                'index_reported_count': stats.get('numberOfDocuments'),
                'indexed_document_count': len(documents),
                'approved_missing_count': len(approved - indexed),
                'unapproved_or_unknown_count': len(indexed - approved),
                'field_coverage': {field: sum(field in row for row in documents)
                                   for field in ('category', 'format', 'genres', 'channel', 'director', 'cast')},
                'searchable_attributes': config.get('searchableAttributes'),
                'filterable_attributes': config.get('filterableAttributes'),
                'ranking_rules': config.get('rankingRules'),
            }, sort_keys=True))
            PY
            python3 - <<'PY'
            import json
            import subprocess

            def service_key(service, name):
                container = subprocess.check_output(
                    ['docker', 'compose', '-f', 'docker-compose.prod.yml', 'ps', '-q', service],
                    text=True,
                ).strip()
                if not container:
                    return None
                values = json.loads(subprocess.check_output(
                    ['docker', 'inspect', '--format', '{{json .Config.Env}}', container], text=True,
                ))
                return next((value[len(name) + 1:] for value in values
                             if value.startswith(name + '=')), None)

            api_key = service_key('api', 'MASTER_KEY')
            engine_key = service_key('meilisearch', 'MEILI_MASTER_KEY')
            print(json.dumps({
                'api_key_configured': bool(api_key),
                'local_meilisearch_running': engine_key is not None,
                'api_and_local_meilisearch_keys_match': bool(api_key) and api_key == engine_key,
            }, sort_keys=True))
            PY

  reindex-search-index:
    name: Safely rebuild production search index
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/search-index-audit' && inputs.operation == 'reindex'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build, verify and atomically swap a shadow index
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
          AUDIT_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          envs: EC2_APP_DIR,AUDIT_RUN_ID
          command_timeout: 8m
          script: |
            set -eu
            cd "$EC2_APP_DIR"
            docker compose -f docker-compose.prod.yml exec -T -e AUDIT_RUN_ID="$AUDIT_RUN_ID" api python - <<'PY'
            import json
            import os
            import time
            from urllib.parse import quote

            import django
            import requests

            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'cbmtv.settings')
            django.setup()
            from django.conf import settings
            from content.views import build_search_documents

            base = settings.MEILISEARCH_URL.rstrip('/')
            uid = settings.MEILISEARCH_INDEX
            if not base or not settings.MEILISEARCH_MASTER_KEY or not uid:
                raise SystemExit('Search connection is not fully configured.')
            shadow = f'{uid}_backup_{os.environ["AUDIT_RUN_ID"]}'
            headers = {'Authorization': f'Bearer {settings.MEILISEARCH_MASTER_KEY}'}

            def call(method, path, payload=None):
                response = requests.request(method, base + path, headers=headers,
                                            json=payload, timeout=30)
                response.raise_for_status()
                return response.json()

            def wait(task):
                task_id = task.get('taskUid') or task.get('uid')
                if task_id is None:
                    raise RuntimeError('Meilisearch did not return a task ID.')
                for _ in range(120):
                    state = call('GET', f'/tasks/{task_id}')
                    if state['status'] == 'succeeded':
                        return
                    if state['status'] == 'failed':
                        raise RuntimeError(f'Meilisearch task {task_id} failed: {state.get("error", {}).get("code")}')
                    time.sleep(1)
                raise RuntimeError(f'Meilisearch task {task_id} timed out.')

            def documents(index):
                rows = []
                while True:
                    page = call('GET', f'/indexes/{quote(index, safe="")}/documents?offset={len(rows)}&limit=1000')
                    batch = page['results']
                    rows.extend(batch)
                    if len(batch) < 1000:
                        return rows

            expected = build_search_documents()
            expected_ids = {row['id'] for row in expected}
            if len(expected_ids) != len(expected):
                raise RuntimeError('Duplicate approved content IDs.')
            before = documents(uid)
            print(json.dumps({'phase': 'before', 'approved': len(expected), 'indexed': len(before),
                              'missing': len(expected_ids - {row['id'] for row in before})}, sort_keys=True))
            wait(call('POST', '/indexes', {'uid': shadow, 'primaryKey': 'id'}))
            print(json.dumps({'phase': 'shadow_created', 'backup_index': shadow}, sort_keys=True))
            wait(call('PATCH', f'/indexes/{quote(shadow, safe="")}/settings', {
                'searchableAttributes': ['title', 'director', 'cast', 'genres', 'genre',
                                         'channel', 'description', 'writer', 'country',
                                         'category', 'format', 'content_type'],
                'filterableAttributes': ['category', 'format', 'channel', 'channel_id'],
            }))
            if expected:
                wait(call('POST', f'/indexes/{quote(shadow, safe="")}/documents?primaryKey=id', expected))
            staged = documents(shadow)
            if len(staged) != len(expected) or {row['id'] for row in staged} != expected_ids:
                raise RuntimeError('Shadow index count or IDs differ from approved database rows; live index untouched.')
            for row in staged:
                if any(field not in row for field in ('category', 'format', 'genres', 'channel')):
                    raise RuntimeError('Shadow index lacks classification metadata; live index untouched.')
            config = call('GET', f'/indexes/{quote(shadow, safe="")}/settings')
            if not {'category', 'format', 'channel_id'}.issubset(config.get('filterableAttributes', [])):
                raise RuntimeError('Shadow index filter settings incomplete; live index untouched.')
            query_checks = {}
            for field in ('category', 'format', 'genres', 'channel'):
                sample = next((row for row in staged if row.get(field)), None)
                if sample is None:
                    query_checks[field] = 'no populated sample'
                    continue
                value = sample[field][0] if isinstance(sample[field], list) else sample[field]
                result = call('POST', f'/indexes/{quote(shadow, safe="")}/search', {
                    'q': str(value), 'attributesToSearchOn': [field], 'limit': len(staged),
                })
                if sample['id'] not in {row['id'] for row in result.get('hits', [])}:
                    raise RuntimeError(f'Shadow index {field} query failed; live index untouched.')
                query_checks[field] = 'passed'
            print(json.dumps({'phase': 'shadow_verified', 'indexed': len(staged),
                              'filterable_attributes': config['filterableAttributes'],
                              'query_checks': query_checks}, sort_keys=True))
            wait(call('POST', '/swap-indexes', [{'indexes': [uid, shadow]}]))
            active = documents(uid)
            if len(active) != len(expected) or {row['id'] for row in active} != expected_ids:
                wait(call('POST', '/swap-indexes', [{'indexes': [uid, shadow]}]))
                raise RuntimeError('Active index verification failed; original index restored.')
            print(json.dumps({'phase': 'complete', 'approved': len(expected), 'indexed': len(active),
                              'backup_index': shadow}, sort_keys=True))
            PY

  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success' && vars.EC2_AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require successful Backend CI for the exact release revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backend-ci.yml/runs" \
            --method GET -f head_sha="$RELEASE_SHA" -f status=success \
            --jq ".workflow_runs | any(.head_sha == \"$RELEASE_SHA\" and .conclusion == \"success\")")"
          [ "$passed" = true ] || { echo "Backend CI has not passed for this release revision" >&2; exit 1; }
      - name: Deploy verified master revision
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          envs: EC2_APP_DIR,RELEASE_SHA
          command_timeout: 18m
          script: |
            set -eu

            : "${EC2_APP_DIR:?Set the EC2_APP_DIR repository variable to the confirmed absolute application directory}"
            case "$EC2_APP_DIR" in
              /*) ;;
              *) echo "EC2_APP_DIR must be an absolute path" >&2; exit 1 ;;
            esac
            [ -d "$EC2_APP_DIR" ] || { echo "EC2_APP_DIR does not exist" >&2; exit 1; }
            cd "$EC2_APP_DIR"
            [ "$(git rev-parse --is-inside-work-tree)" = "true" ]
            [ -z "$(git rev-parse --show-prefix)" ] || { echo "EC2_APP_DIR must be the repository root" >&2; exit 1; }
            [ "$(git branch --show-current)" = "master" ] || { echo "Expected checked-out master branch" >&2; exit 1; }
            [ -f docker-compose.prod.yml ] || { echo "Missing docker-compose.prod.yml" >&2; exit 1; }
            [ -f .env ] || { echo "Missing production .env" >&2; exit 1; }
            git diff --quiet
            git diff --cached --quiet
            docker compose version >/dev/null
            command -v curl >/dev/null
            docker compose -f docker-compose.prod.yml config --quiet
            database="$(docker compose -f docker-compose.prod.yml ps -q postgres)"
            [ -n "$database" ] || { echo "Production Postgres is not running" >&2; exit 1; }
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$database")" = "healthy" ] || {
              echo "Production Postgres is not healthy" >&2
              exit 1
            }

            git fetch origin master
            [ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ] || { echo "master moved since this workflow started" >&2; exit 1; }
            git merge --ff-only "$RELEASE_SHA"
            [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "Deployed Git revision mismatch" >&2; exit 1; }
            docker compose -f docker-compose.prod.yml config --quiet

            # Keep the database and other running services in place.
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate --no-deps api
            container="$(docker compose -f docker-compose.prod.yml ps -q api)"
            [ -n "$container" ] || { echo "API container was not created" >&2; exit 1; }
            attempt=0
            health=""
            while [ "$attempt" -lt 60 ]; do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              [ "$health" = "healthy" ] && break
              [ "$health" != "unhealthy" ] || { echo "API container is unhealthy" >&2; exit 1; }
              attempt=$((attempt + 1))
              sleep 5
            done
            [ "$health" = "healthy" ] || { echo "API health check timed out" >&2; exit 1; }
            [ "$(docker inspect --format '{{.Image}}' "$container")" = "$(docker image inspect --format '{{.Id}}' cbmtv-api:prod)" ] || {
              echo "Running API image does not match the built release image" >&2
              exit 1
            }
            curl --fail --silent --show-error http://127.0.0.1:8000/health/ >/dev/null
            echo "Deployed and healthy: $RELEASE_SHA"
