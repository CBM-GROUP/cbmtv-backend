name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  rotate-production-key:
    name: Rotate weak production Django key
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/taxonomy-prod-key'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate key on EC2 and retain a restricted rollback copy
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          envs: EC2_APP_DIR
          command_timeout: 3m
          script: |
            set -eu
            cd "$EC2_APP_DIR"
            [ "$(git rev-parse HEAD)" = 5fe62d55e300c8e826c42839b073e94d29c6dbdd ]
            curl --fail --silent --show-error http://127.0.0.1:8000/health/ >/dev/null
            command -v python3 >/dev/null
            python3 - <<'PY'
            import os
            from pathlib import Path
            import re
            import secrets
            import shutil
            import stat
            import tempfile

            path = Path('.env')
            backup = Path('.env.branch2-backup')
            if not path.is_file() or backup.exists():
                raise SystemExit('Environment missing or rollback backup already exists; no change made.')
            if not os.access(path, os.W_OK) or not os.access(path.parent, os.W_OK):
                raise SystemExit('Environment is not writable by the deployment account; no change made.')
            lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
            positions = [i for i, line in enumerate(lines) if re.match(r'^\s*(?:export\s+)?SECRET_KEY\s*=', line)]
            if len(positions) > 1:
                raise SystemExit('Multiple SECRET_KEY entries; no change made.')
            new_key = secrets.token_urlsafe(64)
            assert len(new_key) >= 50 and len(set(new_key)) >= 5
            new_line = 'SECRET_KEY=' + new_key + '\n'
            if positions:
                lines[positions[0]] = new_line
            else:
                if lines and not lines[-1].endswith('\n'):
                    lines.append('\n')
                lines.append(new_line)
            shutil.copy2(path, backup)
            backup.chmod(stat.S_IRUSR | stat.S_IWUSR)
            with tempfile.NamedTemporaryFile('w', encoding='utf-8', dir=path.parent, delete=False) as stream:
                temporary = Path(stream.name)
                stream.writelines(lines)
                stream.flush()
                os.fsync(stream.fileno())
            temporary.chmod(stat.S_IRUSR | stat.S_IWUSR)
            os.replace(temporary, path)
            print('Generated a strong production Django key; previous environment retained with mode 0600.')
            PY
            docker compose -f docker-compose.prod.yml config --quiet

  diagnose-taxonomy-release:
    name: Diagnose taxonomy API startup
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/taxonomy-prod-incident'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read API container status and recent startup logs
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          envs: EC2_APP_DIR
          command_timeout: 3m
          script: |
            set -eu
            cd "$EC2_APP_DIR"
            git rev-parse HEAD
            git reflog -5 --format='%h %gs'
            docker compose -f docker-compose.prod.yml ps api
            docker image ls -a --format '{{.ID}} {{.CreatedAt}} {{.Repository}}:{{.Tag}}' | head -20
            docker compose -f docker-compose.prod.yml logs --no-color --tail=100 api

  restore-last-healthy-api:
    name: Restore last healthy API revision
    needs: diagnose-taxonomy-release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/taxonomy-prod-incident'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Restore previously verified EC2 API revision
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          envs: EC2_APP_DIR
          command_timeout: 10m
          script: |
            set -eu
            cd "$EC2_APP_DIR"
            [ "$(git rev-parse HEAD)" = 129fbf858e3628cd1edf96422c59cdde4b2f216f ]
            [ "$(git branch --show-current)" = master ]
            git diff --quiet
            git diff --cached --quiet
            if [ "$(docker compose -f docker-compose.prod.yml ps -q api | xargs -r docker inspect --format '{{.State.Health.Status}}')" = healthy ]; then
              echo 'API has recovered; leaving current revision in place.'
              exit 0
            fi
            git cat-file -e 5fe62d55e300c8e826c42839b073e94d29c6dbdd^{commit}
            git merge-base --is-ancestor 5fe62d55e300c8e826c42839b073e94d29c6dbdd HEAD
            git reset --hard 5fe62d55e300c8e826c42839b073e94d29c6dbdd
            if [ -f .env.branch2-backup ]; then
              if cp -p .env.branch2-backup .env; then
                chmod 600 .env
                echo 'Restored the pre-rotation production environment.'
              else
                echo 'Could not restore the prior environment; continuing API recovery.' >&2
              fi
            fi
            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate --no-deps api
            container="$(docker compose -f docker-compose.prod.yml ps -q api)"
            [ -n "$container" ]
            attempt=0
            health=""
            while [ "$attempt" -lt 60 ]; do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              [ "$health" = healthy ] && break
              [ "$health" != unhealthy ] || { echo 'Rollback API is unhealthy' >&2; exit 1; }
              attempt=$((attempt + 1))
              sleep 5
            done
            [ "$health" = healthy ]
            curl --fail --silent --show-error http://127.0.0.1:8000/health/ >/dev/null
            echo 'Restored last healthy API revision 5fe62d55e300c8e826c42839b073e94d29c6dbdd'

  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success' && vars.EC2_AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require successful Backend CI for the exact release revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backend-ci.yml/runs" \
            --method GET -f head_sha="$RELEASE_SHA" -f status=success \
            --jq ".workflow_runs | any(.head_sha == \"$RELEASE_SHA\" and .conclusion == \"success\")")"
          [ "$passed" = true ] || { echo "Backend CI has not passed for this release revision" >&2; exit 1; }
      - name: Deploy verified master revision
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          envs: EC2_APP_DIR,RELEASE_SHA
          command_timeout: 18m
          script: |
            set -eu

            : "${EC2_APP_DIR:?Set the EC2_APP_DIR repository variable to the confirmed absolute application directory}"
            case "$EC2_APP_DIR" in
              /*) ;;
              *) echo "EC2_APP_DIR must be an absolute path" >&2; exit 1 ;;
            esac
            [ -d "$EC2_APP_DIR" ] || { echo "EC2_APP_DIR does not exist" >&2; exit 1; }
            cd "$EC2_APP_DIR"
            [ "$(git rev-parse --is-inside-work-tree)" = "true" ]
            [ -z "$(git rev-parse --show-prefix)" ] || { echo "EC2_APP_DIR must be the repository root" >&2; exit 1; }
            [ "$(git branch --show-current)" = "master" ] || { echo "Expected checked-out master branch" >&2; exit 1; }
            [ -f docker-compose.prod.yml ] || { echo "Missing docker-compose.prod.yml" >&2; exit 1; }
            [ -f .env ] || { echo "Missing production .env" >&2; exit 1; }
            git diff --quiet
            git diff --cached --quiet
            docker compose version >/dev/null
            command -v curl >/dev/null
            docker compose -f docker-compose.prod.yml config --quiet
            database="$(docker compose -f docker-compose.prod.yml ps -q postgres)"
            [ -n "$database" ] || { echo "Production Postgres is not running" >&2; exit 1; }
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$database")" = "healthy" ] || {
              echo "Production Postgres is not healthy" >&2
              exit 1
            }

            git fetch origin master
            [ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ] || { echo "master moved since this workflow started" >&2; exit 1; }
            git merge --ff-only "$RELEASE_SHA"
            [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "Deployed Git revision mismatch" >&2; exit 1; }
            docker compose -f docker-compose.prod.yml config --quiet

            # Keep the database and other running services in place.
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate --no-deps api
            container="$(docker compose -f docker-compose.prod.yml ps -q api)"
            [ -n "$container" ] || { echo "API container was not created" >&2; exit 1; }
            attempt=0
            health=""
            while [ "$attempt" -lt 60 ]; do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              [ "$health" = "healthy" ] && break
              [ "$health" != "unhealthy" ] || { echo "API container is unhealthy" >&2; exit 1; }
              attempt=$((attempt + 1))
              sleep 5
            done
            [ "$health" = "healthy" ] || { echo "API health check timed out" >&2; exit 1; }
            [ "$(docker inspect --format '{{.Image}}' "$container")" = "$(docker image inspect --format '{{.Id}}' cbmtv-api:prod)" ] || {
              echo "Running API image does not match the built release image" >&2
              exit 1
            }
            curl --fail --silent --show-error http://127.0.0.1:8000/health/ >/dev/null
            echo "Deployed and healthy: $RELEASE_SHA"
