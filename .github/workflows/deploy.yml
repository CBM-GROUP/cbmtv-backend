name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master # In case your default branch is master

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          script: |
            # Navigate to the project directory (Change this path if needed)
            cd ~/cbmtv-backend
            
            # Pull the latest changes from the repository
            git pull origin main
            
            # Rebuild and restart the containers
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Optional: Clean up unused Docker images to save space
            docker image prune -f
