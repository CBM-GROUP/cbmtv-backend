name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  audit-search-index:
    name: Audit production search index without changes
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/search-index-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare approved database titles with active Meilisearch documents
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          envs: EC2_APP_DIR
          command_timeout: 3m
          script: |
            set -eu
            cd "$EC2_APP_DIR"
            docker compose -f docker-compose.prod.yml exec -T api python - <<'PY'
            import json
            import os
            from urllib.parse import quote, urlparse

            import django
            import requests

            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'cbmtv.settings')
            django.setup()
            from django.conf import settings
            from content.models import Content

            uid = settings.MEILISEARCH_INDEX
            base = settings.MEILISEARCH_URL.rstrip('/')
            if not base:
                raise SystemExit('Meilisearch URL is not configured.')
            headers = {'X-Meili-API-Key': settings.MEILISEARCH_MASTER_KEY}
            index_url = f'{base}/indexes/{quote(uid, safe="")}'
            def get(path, **params):
                response = requests.get(index_url + path, headers=headers, params=params, timeout=10)
                response.raise_for_status()
                return response.json()

            approved = set(Content.objects.filter(status='approved').values_list('id', flat=True))
            try:
                stats = get('/stats')
            except requests.HTTPError as exc:
                print(json.dumps({
                    'index': uid,
                    'meilisearch_host': urlparse(base).hostname,
                    'approved_database_count': len(approved),
                    'configured_key_present': bool(settings.MEILISEARCH_MASTER_KEY),
                    'stats_http_status': exc.response.status_code,
                }, sort_keys=True))
                raise SystemExit(0)
            config = get('/settings')
            documents = []
            offset = 0
            while True:
                page = get('/documents', offset=offset, limit=1000)
                rows = page.get('results', [])
                documents.extend(rows)
                offset += len(rows)
                if len(rows) < 1000:
                    break
                if offset > 100000:
                    raise SystemExit('Index audit exceeded the safe document limit.')
            indexed = {int(row['id']) for row in documents if str(row.get('id', '')).isdigit()}
            print(json.dumps({
                'index': uid,
                'approved_database_count': len(approved),
                'index_reported_count': stats.get('numberOfDocuments'),
                'indexed_document_count': len(documents),
                'approved_missing_count': len(approved - indexed),
                'unapproved_or_unknown_count': len(indexed - approved),
                'field_coverage': {field: sum(field in row for row in documents)
                                   for field in ('category', 'format', 'genres', 'channel', 'director', 'cast')},
                'searchable_attributes': config.get('searchableAttributes'),
                'filterable_attributes': config.get('filterableAttributes'),
                'ranking_rules': config.get('rankingRules'),
            }, sort_keys=True))
            PY
            python3 - <<'PY'
            import json
            import subprocess

            def service_key(service, name):
                container = subprocess.check_output(
                    ['docker', 'compose', '-f', 'docker-compose.prod.yml', 'ps', '-q', service],
                    text=True,
                ).strip()
                if not container:
                    return None
                values = json.loads(subprocess.check_output(
                    ['docker', 'inspect', '--format', '{{json .Config.Env}}', container], text=True,
                ))
                return next((value[len(name) + 1:] for value in values
                             if value.startswith(name + '=')), None)

            api_key = service_key('api', 'MASTER_KEY')
            engine_key = service_key('meilisearch', 'MEILI_MASTER_KEY')
            print(json.dumps({
                'api_key_configured': bool(api_key),
                'local_meilisearch_running': engine_key is not None,
                'api_and_local_meilisearch_keys_match': bool(api_key) and api_key == engine_key,
            }, sort_keys=True))
            PY

  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success' && vars.EC2_AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require successful Backend CI for the exact release revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backend-ci.yml/runs" \
            --method GET -f head_sha="$RELEASE_SHA" -f status=success \
            --jq ".workflow_runs | any(.head_sha == \"$RELEASE_SHA\" and .conclusion == \"success\")")"
          [ "$passed" = true ] || { echo "Backend CI has not passed for this release revision" >&2; exit 1; }
      - name: Deploy verified master revision
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          envs: EC2_APP_DIR,RELEASE_SHA
          command_timeout: 18m
          script: |
            set -eu

            : "${EC2_APP_DIR:?Set the EC2_APP_DIR repository variable to the confirmed absolute application directory}"
            case "$EC2_APP_DIR" in
              /*) ;;
              *) echo "EC2_APP_DIR must be an absolute path" >&2; exit 1 ;;
            esac
            [ -d "$EC2_APP_DIR" ] || { echo "EC2_APP_DIR does not exist" >&2; exit 1; }
            cd "$EC2_APP_DIR"
            [ "$(git rev-parse --is-inside-work-tree)" = "true" ]
            [ -z "$(git rev-parse --show-prefix)" ] || { echo "EC2_APP_DIR must be the repository root" >&2; exit 1; }
            [ "$(git branch --show-current)" = "master" ] || { echo "Expected checked-out master branch" >&2; exit 1; }
            [ -f docker-compose.prod.yml ] || { echo "Missing docker-compose.prod.yml" >&2; exit 1; }
            [ -f .env ] || { echo "Missing production .env" >&2; exit 1; }
            git diff --quiet
            git diff --cached --quiet
            docker compose version >/dev/null
            command -v curl >/dev/null
            docker compose -f docker-compose.prod.yml config --quiet
            database="$(docker compose -f docker-compose.prod.yml ps -q postgres)"
            [ -n "$database" ] || { echo "Production Postgres is not running" >&2; exit 1; }
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$database")" = "healthy" ] || {
              echo "Production Postgres is not healthy" >&2
              exit 1
            }

            git fetch origin master
            [ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ] || { echo "master moved since this workflow started" >&2; exit 1; }
            git merge --ff-only "$RELEASE_SHA"
            [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "Deployed Git revision mismatch" >&2; exit 1; }
            docker compose -f docker-compose.prod.yml config --quiet

            # Keep the database and other running services in place.
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate --no-deps api
            container="$(docker compose -f docker-compose.prod.yml ps -q api)"
            [ -n "$container" ] || { echo "API container was not created" >&2; exit 1; }
            attempt=0
            health=""
            while [ "$attempt" -lt 60 ]; do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              [ "$health" = "healthy" ] && break
              [ "$health" != "unhealthy" ] || { echo "API container is unhealthy" >&2; exit 1; }
              attempt=$((attempt + 1))
              sleep 5
            done
            [ "$health" = "healthy" ] || { echo "API health check timed out" >&2; exit 1; }
            [ "$(docker inspect --format '{{.Image}}' "$container")" = "$(docker image inspect --format '{{.Id}}' cbmtv-api:prod)" ] || {
              echo "Running API image does not match the built release image" >&2
              exit 1
            }
            curl --fail --silent --show-error http://127.0.0.1:8000/health/ >/dev/null
            echo "Deployed and healthy: $RELEASE_SHA"
