name: Backend CI

on:
  push:
    branches: [master, feat/backend-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/fix/railway-experiment-no-migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cbmtv_foundation_test
          POSTGRES_USER: cbmtv_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cbmtv_test -d cbmtv_foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: cbmtv.test_settings
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      CBMTV_TEST_DATABASE_URL: postgresql://cbmtv_test:disposable-ci-password@127.0.0.1:5432/cbmtv_foundation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Django system checks
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to disposable database
        run: python manage.py migrate --noinput
      - name: Complete backend suite
        run: python manage.py test --noinput

  ec2_database_readonly:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/railway-experiment-no-migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect existing EC2 database and media configuration
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_PASSPHRASE }}
          envs: EC2_APP_DIR
          command_timeout: 3m
          script: |
            set -eu
            : "${EC2_APP_DIR:?}"
            cd "$EC2_APP_DIR"
            database="$(docker compose -f docker-compose.prod.yml ps -q postgres)"
            [ -n "$database" ]
            printf 'postgres_health=%s\n' "$(docker inspect --format '{{.State.Health.Status}}' "$database")"
            printf 'postgres_published_ports=%s\n' "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$database")"
            printf 'postgres_volume=%s\n' "$(docker inspect --format '{{range .Mounts}}{{.Name}}{{end}}' "$database")"
            printf 'postgres_networks=%s\n' "$(docker inspect --format '{{range $name, $network := .NetworkSettings.Networks}}{{$name}} {{end}}' "$database")"
            for tool in socat tailscale cloudflared ssh sshd; do
              if command -v "$tool" >/dev/null 2>&1; then echo "$tool=available"; else echo "$tool=absent"; fi
            done
            if sudo -n true >/dev/null 2>&1; then echo sudo_noninteractive=available; else echo sudo_noninteractive=absent; fi
            database_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$database")"
            python3 -c 'import socket,sys; connection=socket.socket(); connection.settimeout(3); print("host_to_postgres_tcp="+str(connection.connect_ex((sys.argv[1],5432))==0)); connection.close()' "$database_ip"
            docker compose -f docker-compose.prod.yml exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM content_content;"'
            docker compose -f docker-compose.prod.yml exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT app,max(name) FROM django_migrations GROUP BY app ORDER BY app;"'
            docker compose -f docker-compose.prod.yml exec -T api python -c 'import os; keys=("AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY","AWS_STORAGE_BUCKET_NAME","AWS_S3_REGION_NAME","CLOUDFRONT_BASE_URL","PLAYBACK_COOKIE_DOMAIN"); print("\n".join(k+"_configured="+str(bool(os.environ.get(k))) for k in keys))'
            curl --fail --silent http://127.0.0.1:8000/health/ >/dev/null
            echo api_health=ok
