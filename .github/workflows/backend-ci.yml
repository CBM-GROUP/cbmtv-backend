name: Backend CI

on:
  push:
    branches: [master, feat/backend-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cbmtv_foundation_test
          POSTGRES_USER: cbmtv_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cbmtv_test -d cbmtv_foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: cbmtv.test_settings
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      CBMTV_TEST_DATABASE_URL: postgresql://cbmtv_test:disposable-ci-password@127.0.0.1:5432/cbmtv_foundation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Django system checks
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to disposable database
        run: python manage.py migrate --noinput
      - name: Complete backend suite
        run: python manage.py test --noinput
